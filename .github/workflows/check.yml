name: Check

permissions:
  contents: read

on:
  push:
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.*"
      - "tsconfig.json"
      - "biome.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/check.yml"
    branches: ["**"]
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.*"
      - "tsconfig.json"
      - "biome.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/check.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome CI
        run: pnpm exec biome ci .

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run build
        run: pnpm build

      - name: Run tests
        run: pnpm --if-present test
