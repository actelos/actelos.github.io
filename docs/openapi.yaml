openapi: 3.1.0

info:
  title: MCI (Model Code Interface)
  version: 0.1.0
  description: |
    MCI (Model Control Interface) is an open-source ecosystem of software that enables fast, reliable, secure, and efficient integration between LLM applications and external services.

servers:
  - url: http://localhost:7687
    description: Local MCI server

tags:
  - name: Processes
    description: Create, inspect, and control execution processes.

paths:

  /processes:
    get:
      operationId: listProcesses
      summary: List processes
      description: |
        Returns a list of all processes, optionally filtered by `state` and/or
        `status`. Filters are ANDed together when both are provided — e.g.
        `state=idle&status=failed` returns only processes that are idle *and*
        failed.
      tags: [Processes]
      parameters:
        - $ref: "#/components/parameters/stateFilter"
        - $ref: "#/components/parameters/statusFilter"
      responses:
        "200":
          description: List of processes (may be empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessList"
              examples:
                unfiltered:
                  summary: All processes
                  value:
                    processes:
                      - pid: "proc_01j9z8k2v4f3g5h7m0n1p6q"
                        state: idle
                        status: success
                      - pid: "proc_01j9z8k2v4f3g5h7m0n1p6r"
                        state: running
                        status: null
                      - pid: "proc_01j9z8k2v4f3g5h7m0n1p6s"
                        state: queued
                        status: null
                filteredByState:
                  summary: Filter by state=idle
                  value:
                    processes:
                      - pid: "proc_01j9z8k2v4f3g5h7m0n1p6q"
                        state: idle
                        status: success
                      - pid: "proc_01j9z8k2v4f3g5h7m0n1p6t"
                        state: idle
                        status: canceled
                filteredByBoth:
                  summary: Filter by state=idle&status=failed
                  value:
                    processes:
                      - pid: "proc_01j9z8k2v4f3g5h7m0n1p6u"
                        state: idle
                        status: failed
        "400":
          description: A query parameter value is not a valid enum member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidState:
                  summary: Invalid state value
                  value:
                    error: "Invalid value for 'state': must be one of queued, running, idle."
                invalidStatus:
                  summary: Invalid status value
                  value:
                    error: "Invalid value for 'status': must be one of success, failed, canceled, null."

    post:
      operationId: createProcess
      summary: Submit code for execution
      description: |
        Creates a new process, queues it, and begins execution immediately.
        Returns the process ID (`pid`) used for all subsequent interactions.
      tags: [Processes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProcessRequest"
            examples:
              fetchUser:
                summary: Fetch a user from an external API
                value:
                  code: |
                    const res = await fetch("https://api.example.com/users/1");
                    output(res.json());
      responses:
        "201":
          description: Process created and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessCreatedResponse"
              examples:
                created:
                  summary: Newly created process
                  value:
                    pid: "proc_01j9z8k2v4f3g5h7m0n1p6q"
        "400":
          $ref: "#/components/responses/BadRequest"

  /processes/{pid}:
    parameters:
      - $ref: "#/components/parameters/pid"
    get:
      operationId: getProcess
      summary: Get process state and status
      description: |
        Returns the current state and status of a process. Poll this endpoint
        to track progress. A process is complete when `state` is `idle` and
        `status` is non-null.
      tags: [Processes]
      responses:
        "200":
          description: Process found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"
              examples:
                queued:
                  summary: Waiting for sandbox
                  value:
                    pid: "proc_01j9z8k2v4f3g5h7m0n1p6q"
                    state: queued
                    status: null
                running:
                  summary: Actively executing
                  value:
                    pid: "proc_01j9z8k2v4f3g5h7m0n1p6q"
                    state: running
                    status: null
                success:
                  summary: Completed successfully
                  value:
                    pid: "proc_01j9z8k2v4f3g5h7m0n1p6q"
                    state: idle
                    status: success
                failed:
                  summary: Completed with an error
                  value:
                    pid: "proc_01j9z8k2v4f3g5h7m0n1p6q"
                    state: idle
                    status: failed
                canceled:
                  summary: Terminated via kill signal
                  value:
                    pid: "proc_01j9z8k2v4f3g5h7m0n1p6q"
                    state: idle
                    status: canceled
        "404":
          $ref: "#/components/responses/NotFound"

  /processes/{pid}/output:
    parameters:
      - $ref: "#/components/parameters/pid"
    get:
      operationId: getProcessOutput
      summary: Get structured output
      description: |
        Returns the structured value explicitly set by the intent code via the
        `output()` function. This is the primary channel fed back to the model.
        Only available once the process reaches `idle` with a `success` status.
      tags: [Processes]
      responses:
        "200":
          description: Output retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessOutput"
              examples:
                objectOutput:
                  summary: Output is a JSON object
                  value:
                    output:
                      id: 1
                      name: "Alice"
                      email: "alice@example.com"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotIdle"

  /processes/{pid}/stdout:
    parameters:
      - $ref: "#/components/parameters/pid"
    get:
      operationId: getProcessStdout
      summary: Get raw stdout
      description: |
        Returns the raw standard output stream of the process as plain text.
        Useful for debugging. Available once the process is `idle`.
      tags: [Processes]
      responses:
        "200":
          description: stdout stream content.
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "fetching user...\ndone\n"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotIdle"

  /processes/{pid}/stderr:
    parameters:
      - $ref: "#/components/parameters/pid"
    get:
      operationId: getProcessStderr
      summary: Get raw stderr
      description: |
        Returns the raw standard error stream of the process as plain text.
        Useful for debugging. Available once the process is `idle`.
      tags: [Processes]
      responses:
        "200":
          description: stderr stream content.
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "Error: connect ECONNREFUSED 127.0.0.1:5432\n"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotIdle"

  /processes/{pid}/signals/kill:
    parameters:
      - $ref: "#/components/parameters/pid"
    post:
      operationId: killProcess
      summary: Send kill signal
      description: |
        Stops a `queued` or `running` process. The process transitions to `idle`
        with a `canceled` status. Outputs captured up to the point of
        cancellation are preserved.
      tags: [Processes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Empty body — reserved for future signal options.
            examples:
              empty:
                summary: Empty body
                value: {}
      responses:
        "200":
          description: Kill signal accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"
              examples:
                canceled:
                  summary: Process successfully canceled
                  value:
                    pid: "proc_01j9z8k2v4f3g5h7m0n1p6q"
                    state: idle
                    status: canceled
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Process is already idle and cannot be killed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                alreadyIdle:
                  summary: Process already idle
                  value:
                    error: "Process is already idle."

  /processes/{pid}/signals/run:
    parameters:
      - $ref: "#/components/parameters/pid"
    post:
      operationId: runProcess
      summary: Send run signal
      description: |
        Re-queues an `idle` process for execution. Works on canceled processes
        as well as successfully completed ones. If the process already has
        outputs, `force: true` must be set to explicitly overwrite them.
      tags: [Processes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunSignalRequest"
            examples:
              normal:
                summary: Re-run a canceled process
                value:
                  force: false
              force:
                summary: Overwrite outputs of a completed process
                value:
                  force: true
      responses:
        "200":
          description: Run signal accepted; process re-queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"
              examples:
                requeued:
                  summary: Process re-queued
                  value:
                    pid: "proc_01j9z8k2v4f3g5h7m0n1p6q"
                    state: queued
                    status: null
        "400":
          description: |
            Process has existing outputs and `force` was not set to `true`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                forceRequired:
                  summary: force required to overwrite existing outputs
                  value:
                    error: "Process has existing outputs. Set force: true to overwrite."
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Process is not idle and cannot be re-queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notIdle:
                  summary: Process not in idle state
                  value:
                    error: "Process must be idle to accept a run signal."

components:

  parameters:

    pid:
      name: pid
      in: path
      required: true
      description: The process ID returned by `POST /processes`.
      schema:
        type: string
        examples:
          - "proc_01j9z8k2v4f3g5h7m0n1p6q"

    stateFilter:
      name: state
      in: query
      required: false
      description: |
        Filter processes by life-cycle state. When combined with `status`,
        both filters are applied together (AND).
      schema:
        $ref: "#/components/schemas/ProcessState"

    statusFilter:
      name: status
      in: query
      required: false
      description: |
        Filter processes by execution outcome. When combined with `state`,
        both filters are applied together (AND). Note that `queued` and
        `running` processes always have a `null` status, so combining
        `status=success` with `state=queued` will always return an empty list.
      schema:
        $ref: "#/components/schemas/ProcessStatus"

  schemas:

    ProcessState:
      type: string
      enum: [queued, running, idle]
      description: |
        Where the process is in its life-cycle.
        - `queued` — waiting for the sandbox to become available.
        - `running` — actively executing.
        - `idle` — execution has ended (see `status` for outcome).

    ProcessStatus:
      type: ["string", "null"]
      enum: [success, failed, canceled, null]
      description: |
        The outcome of execution. Only set once the process reaches `idle`.
        - `null` — process has not yet completed.
        - `success` — completed without error.
        - `failed` — completed with an error.
        - `canceled` — terminated early via a kill signal.

    Process:
      type: object
      required: [pid, state, status]
      properties:
        pid:
          type: string
          description: Unique identifier for the process.
          examples:
            - "proc_01j9z8k2v4f3g5h7m0n1p6q"
        state:
          $ref: "#/components/schemas/ProcessState"
        status:
          $ref: "#/components/schemas/ProcessStatus"

    ProcessList:
      type: object
      required: [processes]
      properties:
        processes:
          type: array
          description: The matching processes. Empty array if none match the filters.
          items:
            $ref: "#/components/schemas/Process"

    CreateProcessRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: The code to execute in the sandbox.
          examples:
            - |
              const res = await fetch("https://api.example.com/users/1");
              output(res.json());

    ProcessCreatedResponse:
      type: object
      required: [pid]
      properties:
        pid:
          type: string
          description: The ID of the newly created process.
          examples:
            - "proc_01j9z8k2v4f3g5h7m0n1p6q"

    ProcessOutput:
      type: object
      required: [output]
      properties:
        output:
          description: |
            The structured value set by the intent code via `output()`.
            Can be any JSON-serializable value.

    RunSignalRequest:
      type: object
      properties:
        force:
          type: boolean
          default: false
          description: |
            When `true`, overwrites any existing outputs from a prior execution.
            Required if the process completed successfully and already has output.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.

  responses:

    BadRequest:
      description: Request body is invalid or missing required fields.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missingCode:
              summary: Missing required field
              value:
                error: "Missing required field: code"

    NotFound:
      description: No process found with the given `pid`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            notFound:
              summary: Process not found
              value:
                error: "Process not found."

    NotIdle:
      description: The process has not yet reached the `idle` state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            notIdle:
              summary: Output not yet available
              value:
                error: "Process output is not yet available."